services:
  rover-sim:
    build:
      context: .
      dockerfile: Dockerfile
    image: rover-sim:jazzy
    container_name: rover_sim

    # X11 forwarding para Gazebo y RViz
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_SOFTWARE=0
      # Gazebo Harmonic usa GZ_SIM_RESOURCE_PATH para encontrar modelos
      - GZ_SIM_RESOURCE_PATH=/root/rover_ws/src

    volumes:
      # Workspace montado como volumen (edita en el host, compila en el contenedor)
      - ../:/root/rover_ws
      # Socket X11 del host para GUI
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Caché de colcon para no recompilar desde cero cada vez
      - rover_build_cache:/root/rover_ws/build
      - rover_install_cache:/root/rover_ws/install
      - rover_log_cache:/root/rover_ws/log

    # Acceso a GPU (descomenta si tienes GPU NVIDIA con nvidia-container-toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

    # Necesario para que Gazebo pueda usar interfaces de red y IPC
    network_mode: host
    ipc: host
    pid: host

    # Modo interactivo para poder usar la terminal
    stdin_open: true
    tty: true

    # Comando por defecto: compilar y lanzar la simulación
    command: >
      bash -c "
        cd /root/rover_ws &&
        colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release 2>&1 | tail -20 &&
        source install/setup.bash &&
        ros2 launch rover_bringup simulation.launch.py
      "

volumes:
  rover_build_cache:
  rover_install_cache:
  rover_log_cache:
